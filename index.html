<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17202a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kombi Ustası">
<link rel="manifest" href="manifest.json">
<title>Kombi Ustası</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#17202a}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff;padding-bottom:78px}
header{padding:calc(20px + env(safe-area-inset-top)) 18px 18px;background:#17202a;color:#fff}
header h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.7;font-size:13px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px}
.card{background:#f4f6f8;border-radius:14px;padding:12px}.card b{font-size:18px;display:block}.card span{font-size:11px;color:#68737d}
.section{padding:0 14px}.section h2{font-size:18px;margin:4px 0 12px}
.job{border:1px solid #e4e8ec;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px #00000008}
.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.time{font-size:12px;color:#68737d;margin-top:3px}
.meta{font-size:13px;color:#505c66;margin-top:8px}.price{font-weight:700;margin-top:8px}
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#eaf2ff;color:#245b9b;height:max-content}.done{background:#e7f7ec;color:#22733d}
.actions{display:flex;gap:7px;margin-top:10px}.btn{border:1px solid #dfe4e8;background:#fff;border-radius:9px;padding:8px 10px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:560px;background:#fff;border-top:1px solid #e7eaed;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:none;color:#68737d;font-size:11px;padding:5px}nav button.active{color:#17202a;font-weight:700}
.primary{position:fixed;right:max(18px,calc((100vw - 560px)/2 + 18px));bottom:76px;width:56px;height:56px;border:0;border-radius:50%;background:#17202a;color:white;font-size:28px;box-shadow:0 7px 20px #0004;z-index:4}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center;z-index:10}.modal.open{display:flex}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px}
input,select,textarea{width:100%;padding:12px;border:1px solid #dfe4e8;border-radius:11px;margin:5px 0 10px;font-size:15px;background:white}textarea{min-height:75px}
label{font-size:12px;color:#68737d}.save{width:100%;padding:13px;border:0;border-radius:12px;background:#17202a;color:#fff;font-weight:700}
.empty{text-align:center;padding:35px 10px;color:#7a858f}
</style>
</head>
<body>
<div class="app">
<header><h1>🔥 Kombi Ustası</h1><p>İş, müşteri ve kazanç takibi</p></header>
<div class="summary">
<div class="card"><b id="count">0</b><span>Bugünkü iş</span></div>
<div class="card"><b id="done">0</b><span>Tamamlanan</span></div>
<div class="card"><b id="money">₺0</b><span>Toplam ücret</span></div>
</div>
<section class="section"><h2>Bugünkü İşler</h2><div id="jobs"></div></section>
<button class="primary" onclick="openModal()">+</button>
<nav><button class="active">🏠<br>Özet</button><button onclick="showCalendar()">📅<br>Takvim</button><button onclick="showCustomers()">👤<br>Müşteriler</button></nav>
</div>

<div class="modal" id="modal"><div class="sheet">
<h2>Yeni İş</h2>
<label>Müşteri adı</label><input id="name" placeholder="Ahmet Yılmaz">
<label>Telefon</label><input id="phone" type="tel" placeholder="05xx xxx xx xx">
<label>Saat</label><input id="time" type="time">
<label>İş türü</label><select id="type"><option>Kombi bakım</option><option>Kombi arızası</option><option>Kombi montajı</option><option>Petek temizliği</option><option>Diğer</option></select>
<label>Ücret</label><input id="price" type="number" inputmode="decimal" placeholder="1500">
<label>Adres</label><input id="address" placeholder="Adres">
<label>Not</label><textarea id="note" placeholder="Arıza kodu, kullanılacak parça vb."></textarea>
<button class="save" onclick="addJob()">İşi Kaydet</button>
</div></div>

<script>
let jobs=JSON.parse(localStorage.getItem("kombiJobsV2")||"[]");
const $=id=>document.getElementById(id);
function money(n){return new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(n)}
function render(){
 jobs.sort((a,b)=>a.time.localeCompare(b.time)); $("jobs").innerHTML="";
 if(!jobs.length){$("jobs").innerHTML='<div class="empty">Bugün için kayıtlı iş yok.<br>Alttaki + butonundan ekleyebilirsin.</div>'}
 jobs.forEach((j,i)=>{
  let el=document.createElement("div");el.className="job";
  el.innerHTML=`<div class="row"><div><div class="name">${esc(j.name)}</div><div class="time">${j.time} · ${esc(j.type)}</div></div><span class="badge ${j.done?"done":""}">${j.done?"Tamamlandı":"Bekliyor"}</span></div>
  <div class="meta">${esc(j.address||"Adres yok")}${j.note?"<br>"+esc(j.note):""}</div><div class="price">${money(j.price)}</div>
  <div class="actions">${j.phone?`<button class="btn" onclick="location.href='tel:${j.phone}'">📞 Ara</button>`:""}${j.address?`<button class="btn" onclick="maps('${encodeURIComponent(j.address)}')">📍 Yol tarifi</button>`:""}<button class="btn" onclick="toggle(${i})">${j.done?"Geri al":"Tamamlandı"}</button><button class="btn" onclick="delJob(${i})">Sil</button></div>`;
  $("jobs").appendChild(el);
 });
 $("count").textContent=jobs.length;$("done").textContent=jobs.filter(x=>x.done).length;$("money").textContent=money(jobs.reduce((s,x)=>s+Number(x.price||0),0));
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function openModal(){$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open")}
function addJob(){
 let j={name:$("name").value||"İsimsiz müşteri",phone:$("phone").value,time:$("time").value||"09:00",type:$("type").value,price:Number($("price").value||0),address:$("address").value,note:$("note").value,done:false};
 jobs.push(j);localStorage.setItem("kombiJobsV2",JSON.stringify(jobs));["name","phone","time","price","address","note"].forEach(x=>$(x).value="");closeModal();render();
}
function toggle(i){jobs[i].done=!jobs[i].done;save();render()}
function delJob(i){if(confirm("Bu işi silmek istediğine emin misin?")){jobs.splice(i,1);save();render()}}
function save(){localStorage.setItem("kombiJobsV2",JSON.stringify(jobs))}
function maps(a){location.href="https://maps.apple.com/?q="+a}
function showCalendar(){alert("Takvim ekranını bir sonraki sürümde randevuları günlere göre gösterecek şekilde geliştirebiliriz.")}
function showCustomers(){let names=[...new Set(jobs.map(x=>x.name))];alert(names.length?"Müşteriler: "+names.join("\\n"):"Henüz müşteri kaydı yok.")}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
